<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-85ZK1FJJ6X"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-85ZK1FJJ6X');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaniBook Launch Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <script>
        const token = localStorage.getItem('sani_auth_token');
        if (!token) {
            window.location.href = 'login.html';
        }
    </script>

    <script>
        tailwind.config = { theme: { extend: { colors: { sani: { dark: '#050a14', blue: '#4facfe' } } } } }
    </script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-[1600px] mx-auto">
        
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-xl md:text-2xl font-black text-sani-dark tracking-tight flex items-center gap-3">
                    <img src="assets/imgs/sanilogo.jpeg" class="h-8 w-8 object-contain"> Launch Event Dashboard
                </h1>
                <p class="text-slate-500 text-xs mt-1 ml-11">Real-time attendee list • <span id="last-updated" class="font-mono text-sani-blue">Syncing...</span></p>
            </div>
            
            <div class="flex flex-wrap gap-2 w-full lg:w-auto">
                <a href="index.html" target="_blank" class="flex-1 lg:flex-none justify-center bg-indigo-50 text-indigo-700 px-4 py-2.5 rounded-xl font-bold hover:bg-indigo-100 transition-colors flex items-center gap-2 text-sm border border-indigo-100">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Website
                </a>

                <button onclick="fetchData()" class="flex-1 lg:flex-none justify-center bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl font-bold text-slate-600 hover:bg-slate-100 transition-colors flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-rotate"></i> Refresh
                </button>
                
                <button onclick="logout()" class="flex-1 lg:flex-none justify-center bg-red-50 text-red-600 px-4 py-2.5 rounded-xl font-bold hover:bg-red-100 transition-colors flex items-center gap-2 text-sm border border-red-100">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>

        <div class="mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-sani-dark inline-block min-w-[250px] w-full md:w-auto">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-sani-dark">
                        <i class="fa-solid fa-users text-xl"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Confirmed Attendees</p>
                        <p class="text-4xl font-black text-slate-800 mt-1" id="stat-total">...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500 font-bold">
                            <th class="px-6 py-4">Participant Name</th>
                            <th class="px-6 py-4">Organization & Role</th>
                            <th class="px-6 py-4">Contact Details</th>
                            <th class="px-6 py-4 text-right">Registration Date</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="text-sm text-slate-600 divide-y divide-slate-100">
                        <tr><td colspan="4" class="p-8 text-center text-slate-400">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://hms.cosikenya.org/api/attendees/"; 

        async function fetchData() {
            // 1. Get Token
            const token = localStorage.getItem('sani_auth_token');
            if (!token) { window.location.href = 'login.html'; return; }

            // UI Update
            document.getElementById('last-updated').innerText = "Syncing...";

            try {
                // 2. Send Request with Header
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                // 3. Handle Auth Errors
                if (response.status === 403 || response.status === 401) {
                    logout();
                    return;
                }

                const result = await response.json();

                if(result.status === 'success') {
                    const data = result.data;
                    
                    // Update Stats
                    document.getElementById('stat-total').innerText = data.length;
                    document.getElementById('last-updated').innerText = new Date().toLocaleTimeString();

                    const tbody = document.getElementById('table-body');
                    tbody.innerHTML = '';

                    if(data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400 font-medium">No registrations found yet.</td></tr>`;
                    }
                    
                    // Sort Newest First
                    const sortedData = data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                    sortedData.forEach(p => {
                        const dateObj = new Date(p.created_at);
                        const dateStr = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                        const timeStr = dateObj.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

                        tbody.innerHTML += `
                            <tr class="hover:bg-slate-50 transition-colors group">
                                <td class="px-6 py-4">
                                    <div class="font-bold text-slate-900 text-base">${p.full_name}</div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="font-bold text-sani-dark">${p.organization}</div>
                                    <div class="text-xs text-slate-500 mt-0.5 font-medium bg-slate-100 inline-block px-2 py-0.5 rounded">${p.position || '-'}</div>
                                </td>
                                <td class="px-6 py-4 text-xs">
                                    <div class="mb-1.5 flex items-center gap-2">
                                        <i class="fa-solid fa-envelope w-4 text-slate-400"></i> 
                                        <span class="text-slate-700">${p.email}</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <i class="fa-solid fa-phone w-4 text-slate-400"></i> 
                                        <span class="text-slate-700">${p.phone}</span>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-right">
                                    <div class="text-xs font-mono text-slate-500">${dateStr}</div>
                                    <div class="text-[10px] text-slate-400">${timeStr}</div>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                console.error(error);
                document.getElementById('table-body').innerHTML = `
                    <tr>
                        <td colspan="4" class="p-8 text-center">
                            <div class="text-red-500 font-bold mb-2"><i class="fa-solid fa-triangle-exclamation"></i> Connection Failed</div>
                            <p class="text-xs text-slate-400">Ensure the Django server is running.</p>
                        </td>
                    </tr>`;
            }
        }

        function logout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem('sani_auth_token');
                window.location.href = 'login.html';
            }
        }

        window.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
