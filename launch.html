<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Volume 01 Launch | SaniBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { sani: { aqua: '#00f2fe', blue: '#4facfe', red: '#ff0f39', dark: '#050a14' } }, fontFamily: { sans: ['Outfit', 'sans-serif'], display: ['Syne', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 md:p-6 relative">

    <div class="w-full max-w-2xl bg-white rounded-[2rem] shadow-2xl overflow-hidden relative z-10 border border-slate-100">
        <div class="bg-sani-dark text-white p-8 md:p-10 text-center relative">
            <h1 class="text-3xl md:text-4xl font-display font-black leading-tight mb-2">Event Registration</h1>
            <p class="text-slate-400 text-sm md:text-base">Launch of SaniBook Volume 01</p>
        </div>

        <div class="p-6 md:p-10">
            <form id="registration-form" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Full Name</label>
                        <input type="text" name="name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-sani-blue transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Email Address</label>
                        <input type="email" name="email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-sani-blue transition-all">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Phone</label>
                        <input type="tel" name="phone" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-sani-blue transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Organization</label>
                        <input type="text" name="organization" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-sani-blue transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">Position</label>
                    <input type="text" name="position" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-sani-blue transition-all">
                </div>

                <div class="pt-6">
                    <button type="submit" class="w-full bg-sani-red text-white font-bold uppercase tracking-widest py-4 rounded-xl shadow-lg hover:bg-red-600 transition-all flex justify-center items-center gap-2">
                        <span>Complete Registration</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('registration-form');
        const btn = form.querySelector('button');
        const btnText = btn.querySelector('span');
        const btnIcon = btn.querySelector('i');

        // REPLACE WITH YOUR ACTUAL DJANGO URL
        const API_URL = "https://hms.cosikenya.org/api/submit/"; 

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading
            btn.disabled = true;
            btnText.textContent = "Processing...";
            btnIcon.className = "fa-solid fa-circle-notch fa-spin";
            btn.classList.add('opacity-75');

            const formData = new FormData(form);
            const payload = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    btn.classList.replace('bg-sani-red', 'bg-green-600');
                    btnText.textContent = "Registration Successful!";
                    btnIcon.className = "fa-solid fa-check";
                    alert("Registration Confirmed!");
                    form.reset();
                    
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.classList.replace('bg-green-600', 'bg-sani-red');
                        btn.classList.remove('opacity-75');
                        btnText.textContent = "Complete Registration";
                        btnIcon.className = "fa-solid fa-arrow-right";
                    }, 3000);
                } else {
                    throw new Error('Server error');
                }
            } catch (error) {
                console.error(error);
                alert("Connection Failed. Check console.");
                btn.disabled = false;
                btnText.textContent = "Try Again";
                btnIcon.className = "fa-solid fa-rotate-right";
                btn.classList.remove('opacity-75');
            }
        });
    </script>
</body>
</html>
