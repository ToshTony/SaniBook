<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaniBook Stories Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script>
        tailwind.config = { theme: { extend: { colors: { sani: { dark: '#050a14', blue: '#4facfe', red: '#ff0f39' } } } } }
    </script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-[1600px] mx-auto">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-sani-dark tracking-tight">Stories & Contributors</h1>
                <p class="text-slate-500 text-sm mt-1">Submission Portal Data</p>
            </div>
            
            <div class="flex gap-3">
                <button onclick="logout()" class="text-red-500 font-bold text-sm hover:underline px-4">Logout</button>
                <button onclick="fetchData()" class="bg-white px-4 py-2 rounded-lg font-bold text-slate-700 shadow-sm hover:text-sani-blue transition-all border border-slate-200">
                    <i class="fa-solid fa-rotate mr-2"></i> Refresh
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-sani-blue flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Organizations</p>
                    <p class="text-4xl font-black text-slate-800 mt-1" id="stat-org">0</p>
                </div>
                <div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center text-sani-blue text-xl"><i class="fa-solid fa-building"></i></div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-lime-500 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Individual Contributors</p>
                    <p class="text-4xl font-black text-slate-800 mt-1" id="stat-ind">0</p>
                </div>
                <div class="w-12 h-12 bg-lime-50 rounded-full flex items-center justify-center text-lime-600 text-xl"><i class="fa-solid fa-user-astronaut"></i></div>
            </div>
        </div>

        <div class="mb-6 flex space-x-2 border-b border-slate-200">
            <button onclick="switchTab('org')" id="tab-org" class="pb-3 px-6 text-sm font-bold uppercase tracking-wide border-b-2 border-sani-blue text-sani-blue transition-colors">
                Organization Stories
            </button>
            <button onclick="switchTab('ind')" id="tab-ind" class="pb-3 px-6 text-sm font-bold uppercase tracking-wide border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-colors">
                Individual Contributors
            </button>
        </div>

        <div id="view-org" class="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500 font-bold">
                            <th class="px-6 py-4">Organization & Contact</th>
                            <th class="px-6 py-4">Challenge Area</th>
                            <th class="px-6 py-4">Interventions</th>
                            <th class="px-6 py-4">Size</th>
                            <th class="px-6 py-4 text-right">Date</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-org" class="text-sm text-slate-600 divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-8 text-center text-slate-400">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="view-ind" class="hidden bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500 font-bold">
                            <th class="px-6 py-4">Contributor</th>
                            <th class="px-6 py-4">Contact Info</th>
                            <th class="px-6 py-4">Type</th>
                            <th class="px-6 py-4 w-1/3">Motivation</th>
                            <th class="px-6 py-4 text-right">Date</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-ind" class="text-sm text-slate-600 divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-8 text-center text-slate-400">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // CONFIG
        const API_URL = "http://127.0.0.1:8000/api/get-stories/"; 

        // GLOBAL DATA STORE
        let orgData = [];
        let indData = [];

        async function fetchData() {
            // UI Loading State (Optional visual feedback)
            document.getElementById('stat-org').innerText = '...';
            document.getElementById('stat-ind').innerText = '...';

            try {
                // Direct fetch without headers
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if(result.status === 'success') {
                    // Store Data
                    orgData = result.data.organizations;
                    indData = result.data.individuals;

                    // Update Stats
                    document.getElementById('stat-org').innerText = orgData.length;
                    document.getElementById('stat-ind').innerText = indData.length;
                    
                    // Render Default Tables
                    renderOrgTable();
                    renderIndTable();
                }

            } catch (error) {
                console.error("Fetch Error:", error);
                // alert("Connection Failed. Ensure Django is running.");
                document.getElementById('tbody-org').innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500">Connection Failed. Check Console.</td></tr>`;
            }
        }

        function renderOrgTable() {
            const tbody = document.getElementById('tbody-org');
            tbody.innerHTML = '';
            
            if(orgData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">No organizations yet.</td></tr>`;
                return;
            }

            // Sort by newest first
            const sortedOrgs = [...orgData].sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));

            sortedOrgs.forEach(item => {
                const date = new Date(item.submitted_at).toLocaleDateString();
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 border-b border-slate-100 last:border-0 transition-colors">
                        <td class="px-6 py-4">
                            <div class="font-bold text-sani-dark text-base">${item.organization}</div>
                            <div class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-user mr-1"></i> ${item.contact_name}</div>
                            <div class="text-xs text-slate-400 mt-0.5">${item.email}</div>
                            <div class="text-xs text-slate-400">${item.phone}</div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs font-bold whitespace-nowrap">${item.challenge_area}</span>
                        </td>
                        <td class="px-6 py-4 text-xs max-w-xs leading-relaxed text-slate-600">
                            ${item.intervention_areas}
                        </td>
                        <td class="px-6 py-4 font-mono text-xs font-bold text-slate-700">
                            ${item.page_size} Page(s)
                        </td>
                        <td class="px-6 py-4 text-right text-xs text-slate-400 font-mono whitespace-nowrap">${date}</td>
                    </tr>
                `;
            });
        }

        function renderIndTable() {
            const tbody = document.getElementById('tbody-ind');
            tbody.innerHTML = '';

            if(indData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">No contributors yet.</td></tr>`;
                return;
            }

            // Sort by newest first
            const sortedInds = [...indData].sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));

            sortedInds.forEach(item => {
                const date = new Date(item.submitted_at).toLocaleDateString();
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 border-b border-slate-100 last:border-0 transition-colors">
                        <td class="px-6 py-4">
                            <div class="font-bold text-sani-dark">${item.full_name}</div>
                            <div class="text-xs text-slate-500 bg-slate-100 inline-block px-2 py-0.5 rounded mt-1 font-medium">${item.role}</div>
                        </td>
                        <td class="px-6 py-4 text-xs">
                            <div class="mb-1"><i class="fa-solid fa-envelope w-4 text-slate-400"></i> ${item.email}</div>
                            <div><i class="fa-solid fa-phone w-4 text-slate-400"></i> ${item.phone}</div>
                        </td>
                        <td class="px-6 py-4 text-xs font-bold text-lime-700">
                            ${item.contribution_types}
                        </td>
                        <td class="px-6 py-4 text-xs italic text-slate-500 leading-relaxed max-w-xs">
                            "${item.motivation}"
                        </td>
                        <td class="px-6 py-4 text-right text-xs text-slate-400 font-mono whitespace-nowrap">${date}</td>
                    </tr>
                `;
            });
        }

        // TAB LOGIC
        function switchTab(tab) {
            const viewOrg = document.getElementById('view-org');
            const viewInd = document.getElementById('view-ind');
            const btnOrg = document.getElementById('tab-org');
            const btnInd = document.getElementById('tab-ind');

            if (tab === 'org') {
                viewOrg.classList.remove('hidden');
                viewInd.classList.add('hidden');
                
                btnOrg.classList.add('border-sani-blue', 'text-sani-blue');
                btnOrg.classList.remove('border-transparent', 'text-slate-400');
                
                btnInd.classList.add('border-transparent', 'text-slate-400');
                btnInd.classList.remove('border-sani-blue', 'text-sani-blue');
            } else {
                viewOrg.classList.add('hidden');
                viewInd.classList.remove('hidden');

                btnInd.classList.add('border-sani-blue', 'text-sani-blue');
                btnInd.classList.remove('border-transparent', 'text-slate-400');
                
                btnOrg.classList.add('border-transparent', 'text-slate-400');
                btnOrg.classList.remove('border-sani-blue', 'text-sani-blue');
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
